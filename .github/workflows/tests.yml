name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: worklog_test
          POSTGRES_USER: worklog
          POSTGRES_PASSWORD: worklog
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U worklog -d worklog_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://worklog:worklog@localhost:5433/worklog_test
      JWT_SECRET_KEY: test-secret-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi>=0.116,<1.0" \
            "uvicorn[standard]>=0.35,<1.0" \
            "sqlalchemy>=2.0,<3.0" \
            "asyncpg>=0.30,<1.0" \
            "pydantic-settings>=2.10,<3.0" \
            "alembic>=1.16,<2.0" \
            "pwdlib[argon2]>=0.2,<1.0" \
            "email-validator>=2.2,<3.0" \
            "PyJWT>=2.10,<3.0" \
            "pytest>=8.4,<9.0" \
            "pytest-asyncio>=1.1,<2.0" \
            "httpx>=0.28,<1.0"

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v