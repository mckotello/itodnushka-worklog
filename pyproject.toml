[project]
name = "itodnushka-worklog"
version = "0.1.0"
description = "Сервис учёта рабочего времени и рентабельности проектов"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "alembic>=1.16,<2.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "email-validator>=2.2,<3.0",
    "PyJWT>=2.10,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "httpx>=0.28,<1.0",
]